<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Mastery — Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="Sortable.min.js"></script>
    <script src="data.js"></script>
    <style>
      :root {
        --bg-deep: #1e2a3a;
        --bg-panel: #26374a;
        --bg-panel-light: #31445a;
        --chalk: #f4efe6;
        --chalk-dim: #b9c3ce;
        --coral: #ff6b5b;
        --coral-dark: #e0503f;
        --gold: #ffc94a;
        --teal: #4ecdc4;
        --tile-wood: #f0dfc0;
        --tile-text: #3b2a1e;
        --math: #5b8def;
        --science: #4fb286;
        --phe: #ff9f5b;
        --wb: #b57edc;
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(255, 255, 255, 0.04),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(255, 255, 255, 0.03),
            transparent 40%
          ),
          var(--bg-deep);
        color: var(--chalk);
        font-family: "Atkinson Hyperlegible", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 12px 60px;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: "Baloo 2", sans-serif;
        font-weight: 700;
        margin: 0;
      }
      #topbar {
        width: 100%;
        max-width: 560px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      #topbar .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.3rem;
      }
      #topbar .brand .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--coral);
        box-shadow: 0 0 0 4px rgba(255, 107, 91, 0.25);
      }
      #stats {
        display: none;
        gap: 14px;
        font-size: 0.95rem;
        background: var(--bg-panel);
        padding: 8px 14px;
        border-radius: 999px;
      }
      #stats span {
        white-space: nowrap;
      }
      main {
        width: 100%;
        max-width: 560px;
      }
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
        animation: fadeIn 0.25s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card {
        background: var(--bg-panel);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 16px;
      }
      .subtitle {
        color: var(--chalk-dim);
        font-size: 0.95rem;
        margin-top: 6px;
        line-height: 1.4;
      }

      /* Leaderboard Style */
      #leaderboard-list {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .leaderboard-row {
        display: flex;
        justify-content: space-between;
        background: var(--bg-panel-light);
        padding: 8px 14px;
        border-radius: 10px;
        font-family: "Baloo 2", sans-serif;
      }

      .leaderboard-row.me {
        border: 2px solid var(--gold);
      }

      #my-rank {
        margin-top: 10px;
        color: var(--chalk-dim);
        font-size: 0.9rem;
      }

      /* Login */
      #name-search {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: var(--bg-panel-light);
        color: var(--chalk);
        font-family: "Atkinson Hyperlegible", sans-serif;
        font-size: 1rem;
        margin-top: 14px;
      }

      #roster-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      .name-chip {
        background: var(--bg-panel-light);
        border: 2px solid transparent;
        color: var(--chalk);
        padding: 12px 18px;
        border-radius: 999px;
        font-family: "Baloo 2", sans-serif;
        font-size: 1.05rem;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .name-chip:hover {
        border-color: var(--teal);
      }
      .name-chip.selected {
        background: var(--teal);
        color: var(--bg-deep);
        border-color: var(--teal);
      }
      #pin-area {
        margin-top: 18px;
        display: none;
      }
      #pin-input {
        font-family: "Baloo 2", sans-serif;
        font-size: 1.6rem;
        letter-spacing: 10px;
        width: 160px;
        text-align: center;
        padding: 10px;
        border-radius: 12px;
        border: none;
        background: var(--bg-deep);
        color: var(--chalk);
      }
      .btn {
        font-family: "Baloo 2", sans-serif;
        font-size: 1rem;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.1s ease;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn-primary {
        background: var(--coral);
        color: white;
      }
      .btn-secondary {
        background: var(--bg-panel-light);
        color: var(--chalk);
      }
      .btn-ghost {
        background: transparent;
        color: var(--chalk-dim);
        border: 2px solid var(--bg-panel-light);
      }
      #login-error {
        color: var(--coral);
        margin-top: 10px;
        font-size: 0.9rem;
        min-height: 1.2em;
      }

      /* Menu */
      .material-row {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 14px;
      }
      .material-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-panel-light);
        padding: 16px 18px;
        border-radius: 14px;
        cursor: pointer;
        border-left: 6px solid var(--teal);
      }
      .material-card.part1 {
        border-left-color: var(--gold);
      }
      .material-card.part2 {
        border-left-color: var(--coral);
      }
      .material-card.wordbank {
        border-left-color: var(--wb);
      }
      .material-card h3 {
        font-size: 1.1rem;
      }
      .material-card .subtitle {
        margin-top: 2px;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .mode-chip {
        background: var(--bg-panel-light);
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.9rem;
        border: 2px solid transparent;
      }
      .mode-chip.subject-math {
        border-color: var(--math);
      }
      .mode-chip.subject-science {
        border-color: var(--science);
      }
      .mode-chip.subject-phe {
        border-color: var(--phe);
      }
      .mode-chip:hover {
        background: var(--bg-deep);
      }

      /* Game */
      #clue-placard {
        background: var(--bg-panel-light);
        border-radius: 18px;
        padding: 18px 32px;
        text-align: center;
        margin: 0 auto 22px;
        width: fit-content;
        max-width: 90%;
      }
      #clue-ipa {
        font-family: "Baloo 2", sans-serif;
        font-size: 2.1rem;
        letter-spacing: 1px;
        color: var(--gold);
      }

      #clue-label {
        color: var(--chalk-dim);
        font-size: 0.85rem;
        margin-top: 14px;
        text-align: center;
      }

      #tile-tray {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        min-height: 64px;
        padding: 10px;
        border-radius: 14px;
        justify-content: center;
        background: rgba(255, 255, 255, 0.02);
      }

      /* #answer-wrap {
        position: relative;
        margin-bottom: 18px;
        min-height: 64px;
      }
      #slot-outline,
      #answer-slots {
        position: absolute;
        inset: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        justify-content: center;
      }
      #slot-outline {
        pointer-events: none;
        z-index: 0;
      }
      #answer-slots {
        z-index: 1;
      } */

      #answer-wrap {
        position: relative;
        margin-bottom: 18px;
      }
      #slot-outline {
        position: absolute;
        inset: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        justify-content: center;
        pointer-events: none;
        z-index: 0;
      }
      #answer-slots {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        justify-content: center;
        min-height: 64px;
        z-index: 1;
      }

      .slot-box {
        width: 52px;
        height: 52px;
        border: 3px dashed var(--bg-panel-light);
        border-radius: 10px;
      }

      .answer-slot {
        width: 52px;
        height: 52px;
      }
      .tile {
        background: var(--tile-wood);
        color: var(--tile-text);
        font-family: "Baloo 2", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
        cursor: grab;
        user-select: none;
      }
      .tile:active {
        cursor: grabbing;
        transform: scale(0.93);
      }
      .tile {
        transition: transform 0.08s ease;
      }
      .sortable-ghost {
        opacity: 0.3;
      }

      #game-controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      #feedback {
        text-align: center;
        margin-top: 14px;
        font-family: "Baloo 2", sans-serif;
        font-size: 1.1rem;
        min-height: 1.4em;
      }
      #feedback.correct {
        color: var(--science);
      }
      #feedback.wrong {
        color: var(--coral);
      }
      #exit-row {
        text-align: center;
        margin-top: 18px;
      }

      #timer-display {
        text-align: center;
        font-family: "Baloo 2", sans-serif;
        font-size: 1.1rem;
        color: var(--chalk-dim);
        margin-bottom: 8px;
      }
      #timer-display.warning {
        color: var(--gold);
      }
      #timer-display.expired {
        color: var(--coral);
      }

      .stepper-group {
        display: flex;
        gap: 14px;
        justify-content: center;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .stepper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .stepper-value {
        background: var(--bg-panel-light);
        border-radius: 10px;
        padding: 10px 16px;
        text-align: center;
        min-width: 70px;
      }
      .stepper-label {
        display: block;
        font-size: 0.75rem;
        color: var(--chalk-dim);
      }
      .stepper-value span:last-child {
        font-family: "Baloo 2", sans-serif;
        font-size: 1.3rem;
        font-weight: 700;
      }
      .stepper-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: var(--teal);
        color: var(--bg-deep);
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
      }
      .stepper-btn:active {
        transform: scale(0.9);
      }

      .material-card.locked {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #clue-ipa-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #btn-pronounce {
        background: var(--teal);
        border: none;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #btn-pronounce:active {
        transform: scale(0.9);
      }

      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 20px;
      }
      .modal-overlay.active {
        display: flex;
      }
      .modal-box {
        background: var(--bg-panel);
        border-radius: 18px;
        padding: 24px;
        max-width: 400px;
        text-align: center;
      }
      .modal-box p {
        font-family: "Baloo 2", sans-serif;
        font-size: 1.1rem;
        margin: 0 0 18px;
        line-height: 1.4;
      }

      #site-footer {
        margin-top: 30px;
        font-size: 0.8rem;
        color: var(--chalk-dim);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="topbar">
      <div class="brand">
        <span class="dot"></span><span>Word Mastery</span>
      </div>
      <div id="stats">
        <span id="stat-score">⭐ 0</span><span id="stat-streak">🔥 0</span
        ><button
          id="btn-logout"
          class="btn btn-ghost"
          style="padding: 4px 10px; font-size: 0.8rem"
        >
          Logout
        </button>
      </div>
    </div>

    <main>
      <!-- LOGIN -->
      <section id="screen-login" class="screen active">
        <div class="card">
          <h2>Who's playing?</h2>
          <p class="subtitle">
            Pick your name from the list, then enter your PIN.
          </p>
          <input id="name-search" type="text" placeholder="Type your name..." />
          <div id="roster-grid"></div>
          <div id="pin-area">
            <p class="subtitle" id="pin-prompt"></p>
            <input
              id="pin-input"
              type="password"
              inputmode="numeric"
              maxlength="4"
              placeholder="••••"
            />
            <div style="margin-top: 12px">
              <button class="btn btn-primary" id="pin-submit">Enter</button>
            </div>
            <div id="login-error"></div>
          </div>
        </div>
      </section>

      <!-- MENU -->
      <section id="screen-menu" class="screen">
        <div class="card" id="leaderboard-card">
          <h3>🏆 Top Scores</h3>
          <div id="leaderboard-list"></div>
          <div id="my-rank"></div>
        </div>
        <div class="card">
          <h2 id="menu-greeting">What do you want to practice?</h2>
          <div class="material-row" id="material-row"></div>
          <button
            class="btn btn-secondary"
            id="random-everything-btn"
            style="width: 100%; margin-top: 12px"
          >
            🎲 Random Mix — Everything
          </button>
          <button
            class="btn btn-secondary"
            id="practice-missed-btn"
            style="width: 100%; margin-top: 10px; display: none"
          >
            🔁 Practice Missed Words
          </button>
          <div id="submenu"></div>
        </div>
      </section>

      <!-- GAME -->
      <section id="screen-game" class="screen">
        <div id="timer-display">⏱ <span id="timer-value">--</span>s</div>
        <div id="clue-placard">
          <div id="clue-ipa-row">
            <div id="clue-ipa">/ /</div>
            <button id="btn-pronounce" title="Hear pronunciation">🔊</button>
          </div>
        </div>

        <div id="answer-wrap">
          <div id="slot-outline"></div>
          <div id="answer-slots"></div>
        </div>
        <div id="tile-tray"></div>
        <div id="clue-label">Drag or tap the letters to spell the word</div>

        <div id="game-controls">
          <button class="btn btn-primary" id="btn-check">Check</button>
          <button class="btn btn-secondary" id="btn-skip">Skip word</button>
        </div>
        <div id="feedback"></div>
        <div id="exit-row">
          <button class="btn btn-ghost" id="btn-exit">Exit to menu</button>
        </div>
      </section>
    </main>

    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-box">
        <p id="modal-message"></p>
        <button class="btn btn-primary" id="modal-btn"></button>
      </div>
    </div>

    <footer id="site-footer">
      © <span id="copyright-year"></span> HMC Academy. All rights reserved.
    </footer>

    <script>
      /* ---------------------------------------------------
   STATE
--------------------------------------------------- */
      let state = {
        child: null,
        deepLink: parseDeepLink(),
        queue: [],
        index: 0,
        score: 0,
        streak: 0,
        attempts: 0,
        words: {},
        recycled: new Set(),
        resurfaceIds: new Set(),
        practiceMode: false,
      };

      function parseDeepLink() {
        const params = new URLSearchParams(window.location.search);
        if (!params.has("material")) return null;
        return {
          material: params.get("material"),
          page: params.get("page") ? parseInt(params.get("page")) : null,
          topic: params.get("topic"),
          locked: params.get("locked") === "true",
        };
      }

      /* ---------------------------------------------------
   LOGIN
--------------------------------------------------- */
      const rosterGrid = document.getElementById("roster-grid");
      const pinArea = document.getElementById("pin-area");
      const pinPrompt = document.getElementById("pin-prompt");
      const pinInput = document.getElementById("pin-input");
      const loginError = document.getElementById("login-error");
      let pendingName = null;

      ROSTER.forEach((r) => {
        const chip = document.createElement("div");
        chip.className = "name-chip";
        chip.textContent = r.name;
        chip.onclick = () => {
          document
            .querySelectorAll(".name-chip")
            .forEach((c) => c.classList.remove("selected"));
          chip.classList.add("selected");
          pendingName = r.name;
          pinPrompt.textContent = `Enter ${r.name}'s PIN`;
          pinArea.style.display = "block";
          pinInput.value = "";
          loginError.textContent = "";
          pinInput.focus();
        };
        rosterGrid.appendChild(chip);
      });

      // The search name function
      function createNameChip(name) {
        const chip = document.createElement("div");
        chip.className = "name-chip";
        chip.textContent = name;
        chip.onclick = () => {
          document
            .querySelectorAll(".name-chip")
            .forEach((c) => c.classList.remove("selected"));
          chip.classList.add("selected");
          pendingName = name;
          pinPrompt.textContent = `Enter ${name}'s PIN`;
          pinArea.style.display = "block";
          pinInput.value = "";
          loginError.textContent = "";
          pinInput.focus();
        };
        return chip;
      }

      function renderNameResults(query) {
        rosterGrid.innerHTML = "";
        if (!query) {
          rosterGrid.innerHTML = `<p class="subtitle">Start typing your name above...</p>`;
          return;
        }
        const matches = ROSTER.filter((r) =>
          r.name.toLowerCase().includes(query.toLowerCase()),
        ).slice(0, 8);
        if (matches.length === 0) {
          rosterGrid.innerHTML = `<p class="subtitle">No matches — check your spelling.</p>`;
          return;
        }
        matches.forEach((r) => rosterGrid.appendChild(createNameChip(r.name)));
      }

      document.getElementById("name-search").addEventListener("input", (e) => {
        renderNameResults(e.target.value.trim());
      });

      renderNameResults("");

      document.getElementById("pin-submit").onclick = attemptLogin;
      pinInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") attemptLogin();
      });

      function attemptLogin() {
        const record = ROSTER.find((r) => r.name === pendingName);
        if (record && record.pin === pinInput.value) {
          state.child = record.name;
          localStorage.setItem("currentChild", state.child);
          document.getElementById("stats").style.display = "flex";
          loadProgress();
          if (state.deepLink) {
            startFromDeepLink();
          } else {
            showScreen("menu");
            renderMenu();
          }
        } else {
          loginError.textContent = "That PIN doesn't match — try again.";
        }
      }

      /* ---------------------------------------------------
   PROGRESS (localStorage stand-in for future Firebase)
--------------------------------------------------- */
      function progressKey() {
        return `wordmastery_${state.child}`;
      }

      function loadProgress() {
        const raw = localStorage.getItem(progressKey());
        const data = raw
          ? JSON.parse(raw)
          : {
              score: 0,
              streak: 0,
              words: {},
              unlocked: { part2: false, wordbank: false },
            };
        state.score = data.score;
        state.streak = data.streak;
        state.words = data.words || {};
        state.unlocked = data.unlocked || { part2: false, wordbank: false };
        updateStatsBar();
      }

      function saveProgress() {
        localStorage.setItem(
          progressKey(),
          JSON.stringify({
            score: state.score,
            streak: state.streak,
            words: state.words,
            unlocked: state.unlocked,
          }),
        );
        updateStatsBar();
      }

      // to reset "cleared" status
      function recordAttempt(wordId, wasWrong) {
        if (!state.words[wordId])
          state.words[wordId] = { attempts: 0, wrongAttempts: 0, skips: 0 };
        state.words[wordId].attempts++;
        if (wasWrong) {
          state.words[wordId].wrongAttempts++;
          state.words[wordId].cleared = false;
        }
      }

      function recordSkip(wordId) {
        if (!state.words[wordId])
          state.words[wordId] = { attempts: 0, wrongAttempts: 0, skips: 0 };
        state.words[wordId].skips++;
        state.words[wordId].cleared = false;
      }

      // A function to get the current missed-words list
      function getMissedWords() {
        return getAllWords().filter((w) => {
          const rec = state.words[w.id];
          return (
            rec && (rec.wrongAttempts > 0 || rec.skips > 0) && !rec.cleared
          );
        });
      }

      function updateStatsBar() {
        document.getElementById("stat-score").textContent = `⭐ ${state.score}`;
        document.getElementById("stat-streak").textContent =
          `🔥 ${state.streak}`;
      }

      /* ---------------------------------------------------
   SCREEN SWITCHING
--------------------------------------------------- */
      function showScreen(name) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById("screen-" + name).classList.add("active");
      }

      /* ---------------------------------------------------
   MENU
--------------------------------------------------- */
      const materialRow = document.getElementById("material-row");
      const submenu = document.getElementById("submenu");

      function renderMenu() {
        materialRow.style.display = "";
        document.getElementById("random-everything-btn").style.display = "";
        document.getElementById("menu-greeting").textContent =
          `Hi ${state.child}! What do you want to practice?`;
        renderLeaderboard();
        materialRow.innerHTML = "";
        submenu.innerHTML = "";
        Object.keys(MATERIAL_LABELS).forEach((matKey) => {
          const info = MATERIAL_LABELS[matKey];
          const isLocked = matKey !== "part1" && !state.unlocked[matKey];
          const card = document.createElement("div");
          card.className = `material-card ${info.cls}${isLocked ? " locked" : ""}`;
          card.innerHTML = `<div><h3>${info.title}</h3><div class="subtitle">${isLocked ? "🔒 Not unlocked yet" : info.subtitle}</div></div><div>${isLocked ? "🔒" : "▶"}</div>`;
          card.onclick = () => {
            if (!isLocked) renderSubmenu(matKey);
          };
          materialRow.appendChild(card);
        });

        // Show/hide it with a live count
        const missed = getMissedWords();
        const missedBtn = document.getElementById("practice-missed-btn");
        if (missed.length > 0) {
          missedBtn.style.display = "block";
          missedBtn.textContent = `🔁 Practice Missed Words (${missed.length})`;
        } else {
          missedBtn.style.display = "none";
        }
      }

      // Wire the click
      document.getElementById("practice-missed-btn").onclick = () => {
        startGame(getMissedWords(), { practiceMode: true });
      };

      // Leaderboard Script
      function getLeaderboard() {
        const entries = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith("wordmastery_")) {
            const name = key.replace("wordmastery_", "");
            const data = JSON.parse(localStorage.getItem(key));
            entries.push({ name, score: data.score || 0 });
          }
        }
        entries.sort((a, b) => b.score - a.score);
        return entries;
      }

      function renderLeaderboard() {
        const board = getLeaderboard();
        const medals = ["🥇", "🥈", "🥉"];
        const list = document.getElementById("leaderboard-list");
        list.innerHTML = board
          .slice(0, 3)
          .map(
            (e, i) =>
              `<div class="leaderboard-row ${e.name === state.child ? "me" : ""}"> 
       <span>${medals[i]} ${e.name}</span> <span>${e.score}</span>
      </div>
    `,
          )
          .join("");

        const myRank = board.findIndex((e) => e.name === state.child) + 1;
        const myRankEl = document.getElementById("my-rank");
        myRankEl.textContent =
          myRank > 3
            ? `You're #${myRank} with ${board[myRank - 1].score} points - keep going!`
            : "";
      }

      /*
      clicking a material now hides the other two cards and the random-everything button entirely, replacing the view with just that material's options plus a Back button. No more ambiguity about which section the chips belong to.
      */

      function renderSubmenu(material) {
        materialRow.style.display = "none";
        document.getElementById("random-everything-btn").style.display = "none";

        const words = getAllWords().filter((w) => w.material === material);

        let html = `<div class="card"><h3>${MATERIAL_LABELS[material].title}</h3>`;
        html += `<p class="subtitle">Choose how to practice:</p>`;

        if (material === "wordbank") {
          html += `<div class="chip-row" id="page-chips"></div>`;
          html += `<p class="subtitle" style="margin-top:14px;">Or by subject:</p>`;
          html += `<div class="chip-row" id="topic-chips"></div>`;
        } else {
          html += `
      <div class="stepper-group">
        <div class="stepper">
          <button class="stepper-btn" id="module-prev">−</button>
          <div class="stepper-value"><span class="stepper-label">Module</span><span id="module-display">1</span></div>
          <button class="stepper-btn" id="module-next">+</button>
        </div>
        <div class="stepper">
          <button class="stepper-btn" id="unit-prev">−</button>
          <div class="stepper-value"><span class="stepper-label">Unit</span><span id="unit-display">1</span></div>
          <button class="stepper-btn" id="unit-next">+</button>
        </div>
        <div class="stepper">
          <button class="stepper-btn" id="lesson-prev">−</button>
          <div class="stepper-value"><span class="stepper-label">Lesson</span><span id="lesson-display">1</span></div>
          <button class="stepper-btn" id="lesson-next">+</button>
        </div>
      </div>
      <button class="btn btn-primary" id="lesson-start-btn" style="margin-top:14px;width:100%;">▶ Start Practicing</button>
    `;
        }

        html += `<p class="subtitle" style="margin-top:14px;">Or:</p>`;
        html += `<button class="btn btn-secondary" id="random-btn" style="margin-top:6px;">🎲 Random mix</button>`;
        html += `<div style="margin-top:16px;"><button class="btn btn-ghost" id="submenu-back-btn">← Back</button></div>`;
        html += `</div>`;
        submenu.innerHTML = html;

        if (material === "wordbank") {
          const pages = [...new Set(words.map((w) => w.page))].sort(
            (a, b) => a - b,
          );
          const pageChips = document.getElementById("page-chips");
          pages.forEach((p) => {
            const chip = document.createElement("div");
            chip.className = "mode-chip";
            chip.textContent = `Page ${p}`;
            chip.onclick = () => startGame(words.filter((w) => w.page === p));
            pageChips.appendChild(chip);
          });

          const topicChips = document.getElementById("topic-chips");
          const topics = [...new Set(words.map((w) => w.topic))];
          topics.forEach((t) => {
            const chip = document.createElement("div");
            chip.className = `mode-chip subject-${t === "mathematics" ? "math" : t}`;
            chip.textContent = t.charAt(0).toUpperCase() + t.slice(1);
            chip.onclick = () => startGame(words.filter((w) => w.topic === t));
            topicChips.appendChild(chip);
          });
        } else {
          buildLessonPicker(words);
        }

        document.getElementById("random-btn").onclick = () =>
          startGame(shuffleArray([...words]));
        document.getElementById("submenu-back-btn").onclick = () => {
          materialRow.style.display = "";
          document.getElementById("random-everything-btn").style.display = "";
          submenu.innerHTML = "";
        };
      }

      // Script for random-everything-btn
      document.getElementById("random-everything-btn").onclick = () => {
        const unlockedWords = getAllWords().filter(
          (w) => w.material === "part1" || state.unlocked[w.material],
        );
        startGame(shuffleArray(unlockedWords));
      };

      /* ---------------------------------------------------
   DEEP LINK (dedicated video link → locked practice)
--------------------------------------------------- */
      function startFromDeepLink() {
        const dl = state.deepLink;
        let words = getAllWords().filter((w) => w.material === dl.material);
        if (dl.page) words = words.filter((w) => w.page === dl.page);
        if (dl.topic) words = words.filter((w) => w.topic === dl.topic);
        if (words.length === 0) {
          showScreen("menu");
          renderMenu();
          return;
        }
        startGame(words);
      }

      /* ---------------------------------------------------
   GAME LOOP
--------------------------------------------------- */
      const answerSlots = document.getElementById("answer-slots");
      const tileTray = document.getElementById("tile-tray");
      const feedback = document.getElementById("feedback");

      let slotSortables = [];
      let sortableTray;
      let timerInterval = null;

      // to support practice mode and reset per-session tracking
      function startGame(words, options = {}) {
        state.queue = shuffleArray([...words]);
        state.index = 0;
        state.recycled = new Set();
        state.resurfaceIds = new Set();
        state.practiceMode = !!options.practiceMode;
        state.sessionStarted = false;
        showScreen("game");
        renderWord();
      }

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function shuffleLetters(word) {
        const letters = word.split("");
        let shuffled;
        do {
          shuffled = shuffleArray([...letters]);
        } while (shuffled.join("") === word && letters.length > 1);
        return shuffled;
      }

      function renderWord() {
        feedback.textContent = "";
        feedback.className = "";
        state.attempts = 0;

        const current = state.queue[state.index];
        document.getElementById("clue-ipa").textContent = current.ipa;
        document.getElementById("btn-pronounce").onclick = () =>
          speakWord(current.word);

        if (!state.sessionStarted) {
          state.sessionStarted = true;
          document.getElementById("timer-value").textContent = "⏳";
          showModal(
            "⏱ Get ready! The timer starts as soon as you tap Start.",
            "Start",
            () => startTimer(current.word),
          );
        } else {
          startTimer(current.word);
        }

        answerSlots.innerHTML = "";
        tileTray.innerHTML = "";

        /*Every time a new word loads, this clears the old outline boxes and draws a fresh row. One box per letter in current.word. A 4-letter word gets 4 boxes, a 7-letter word gets 7.*/
        const slotOutline = document.getElementById("slot-outline");
        slotOutline.innerHTML = "";
        for (let i = 0; i < current.word.length; i++) {
          const box = document.createElement("div");
          box.className = "slot-box";
          slotOutline.appendChild(box);

          const slot = document.createElement("div");
          slot.className = "answer-slot";
          answerSlots.appendChild(slot);
        }

        const jumbled = shuffleLetters(current.word);
        jumbled.forEach((letter, i) => {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.textContent = letter;
          tile.dataset.letter = letter.toLowerCase();
          tile.dataset.uid = `${current.id}-${i}`;
          tileTray.appendChild(tile);
        });

        slotSortables.forEach((s) => s.destroy());
        if (sortableTray) sortableTray.destroy();

        slotSortables = [...answerSlots.querySelectorAll(".answer-slot")].map(
          (slot) =>
            new Sortable(slot, {
              group: "tiles",
              animation: 150,
              onEnd: handleSlotSwap,
            }),
        );
        sortableTray = new Sortable(tileTray, {
          group: "tiles",
          animation: 150,
          onEnd: handleSlotSwap,
        });

        /* if a tile is dropped on a slot that already has one, bump the old occupant back to wherever the new tile came from. */
        function handleSlotSwap(evt) {
          const to = evt.to;
          if (to.classList.contains("answer-slot") && to.children.length > 1) {
            const bumped = [...to.children].find((el) => el !== evt.item);
            if (bumped) evt.from.appendChild(bumped);
          }
        }
      }

      /* Click/tap a tile as an alternative to dragging it.
   Tapping a tile in the tray moves it to the answer.
   Tapping a tile in the answer sends it back to the tray. */
      function handleTileTap(e) {
        const tile = e.target.closest(".tile");
        if (!tile) return;
        if (tile.parentElement === tileTray) {
          const emptySlot = answerSlots.querySelector(".answer-slot:empty");
          if (emptySlot) emptySlot.appendChild(tile);
        } else if (tile.parentElement.classList.contains("answer-slot")) {
          tileTray.appendChild(tile);
        }
      }

      tileTray.addEventListener("click", handleTileTap);
      answerSlots.addEventListener("click", handleTileTap);

      document.getElementById("btn-check").onclick = () => {
        const current = state.queue[state.index];
        const placed = [...answerSlots.querySelectorAll(".answer-slot")]
          .map((slot) =>
            slot.firstElementChild ? slot.firstElementChild.dataset.letter : "",
          )
          .join("");

        state.attempts++;

        if (placed === current.word.toLowerCase()) {
          stopTimer();
          recordAttempt(current.id, false);

          if (state.practiceMode) {
            if (!state.words[current.id])
              state.words[current.id] = {
                attempts: 0,
                wrongAttempts: 0,
                skips: 0,
              };
            state.words[current.id].cleared = true;
            state.resurfaceIds.delete(current.id);
            feedback.textContent = "🏆 Mastered! +7";
            feedback.className = "correct";
            state.score += 7;
            state.streak = 0;
          } else if (state.resurfaceIds.has(current.id)) {
            state.resurfaceIds.delete(current.id);
            feedback.textContent = "🎉 You beat it! +7 bonus";
            feedback.className = "correct";
            state.score += 7;
            state.streak = 0;
          } else if (state.attempts === 1) {
            feedback.textContent = "🎉 Perfect on the first try!";
            feedback.className = "correct";
            state.score += 10;
            state.streak += 1;
          } else {
            feedback.textContent = "✅ Correct!";
            feedback.className = "correct";
            state.score += 5;
            state.streak = 0;
          }
          saveProgress();
          setTimeout(nextWord, 900);
        } else {
          recordAttempt(current.id, true);
          feedback.textContent = "Not quite — try again!";
          feedback.className = "wrong";
          state.streak = 0;
          saveProgress();
        }
      };

      document.getElementById("btn-skip").onclick = () => {
        stopTimer();
        const current = state.queue[state.index];
        recordSkip(current.id);
        state.streak = 0;
        saveProgress();

        if (!state.recycled.has(current.id)) {
          state.recycled.add(current.id);
          state.resurfaceIds.add(current.id);
          state.queue.push(current);
        }

        showModal(
          `You skipped "${current.word}". Check ${describeLocation(current)} to review it — you'll see it again soon.`,
          "Next Word",
          nextWord,
        );
      };

      document.getElementById("btn-exit").onclick = () => {
        stopTimer();
        showScreen("menu");
        renderMenu();
      };

      function nextWord() {
        state.index++;
        if (state.index >= state.queue.length) {
          stopTimer();
          feedback.textContent =
            "🏁 Set complete! Choose something else to practice.";
          feedback.className = "correct";
          setTimeout(() => {
            showScreen("menu");
            renderMenu();
          }, 1400);
          return;
        }
        renderWord();
      }

      // script for logout persistence
      function logout() {
        localStorage.removeItem("currentChild");
        state.child = null;
        document.getElementById("stats").style.display = "none";
        pinArea.style.display = "none";
        document
          .querySelectorAll(".name-chip")
          .forEach((c) => c.classList.remove("selected"));
        showScreen("login");
      }
      document.getElementById("btn-logout").onclick = logout;

      // Add the picker logic
      function buildLessonPicker(words) {
        const modules = [...new Set(words.map((w) => w.module))].sort(
          (a, b) => a - b,
        );
        let mIdx = 0;

        const unitsFor = (mod) =>
          [
            ...new Set(
              words.filter((w) => w.module === mod).map((w) => w.unit),
            ),
          ].sort((a, b) => a - b);
        const lessonsFor = (mod, unit) =>
          [
            ...new Set(
              words
                .filter((w) => w.module === mod && w.unit === unit)
                .map((w) => w.lesson),
            ),
          ].sort((a, b) => a - b);

        let units = unitsFor(modules[mIdx]);
        let uIdx = 0;
        let lessons = lessonsFor(modules[mIdx], units[uIdx]);
        let lIdx = 0;

        function refresh() {
          document.getElementById("module-display").textContent = modules[mIdx];
          document.getElementById("unit-display").textContent = units[uIdx];
          document.getElementById("lesson-display").textContent = lessons[lIdx];
        }

        function changeModule(dir) {
          mIdx = Math.max(0, Math.min(modules.length - 1, mIdx + dir));
          units = unitsFor(modules[mIdx]);
          uIdx = 0;
          lessons = lessonsFor(modules[mIdx], units[uIdx]);
          lIdx = 0;
          refresh();
        }
        function changeUnit(dir) {
          uIdx = Math.max(0, Math.min(units.length - 1, uIdx + dir));
          lessons = lessonsFor(modules[mIdx], units[uIdx]);
          lIdx = 0;
          refresh();
        }
        function changeLesson(dir) {
          lIdx = Math.max(0, Math.min(lessons.length - 1, lIdx + dir));
          refresh();
        }

        document.getElementById("module-prev").onclick = () => changeModule(-1);
        document.getElementById("module-next").onclick = () => changeModule(1);
        document.getElementById("unit-prev").onclick = () => changeUnit(-1);
        document.getElementById("unit-next").onclick = () => changeUnit(1);
        document.getElementById("lesson-prev").onclick = () => changeLesson(-1);
        document.getElementById("lesson-next").onclick = () => changeLesson(1);

        document.getElementById("lesson-start-btn").onclick = () => {
          startGame(
            words.filter(
              (w) =>
                w.module === modules[mIdx] &&
                w.unit === units[uIdx] &&
                w.lesson === lessons[lIdx],
            ),
          );
        };

        refresh();
      }

      function speakWord(word) {
        if (!("speechSynthesis" in window)) {
          alert("Sorry, this browser doesn't support audio pronunciation.");
          return;
        }
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = "en-GB";
        speechSynthesis.speak(utterance);
      }

      // A helper to describe where a word lives in the book
      function describeLocation(word) {
        if (word.material === "wordbank") {
          return `page ${word.page}${word.topic ? " (" + word.topic + ")" : ""}`;
        }
        return `Module ${word.module} · Unit ${word.unit} · Lesson ${word.lesson}`;
      }

      // timer functions
      function getTimeLimit(word) {
        return 10 + word.length * 2;
      }

      function startTimer(word) {
        clearInterval(timerInterval);
        let timeLeft = getTimeLimit(word);
        const display = document.getElementById("timer-display");
        const valueEl = document.getElementById("timer-value");
        display.classList.remove("warning", "expired");
        valueEl.textContent = timeLeft;

        timerInterval = setInterval(() => {
          timeLeft--;
          valueEl.textContent = Math.max(timeLeft, 0);
          display.classList.remove("warning", "expired");
          if (timeLeft <= 5 && timeLeft > 0) display.classList.add("warning");
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            display.classList.add("expired");
            handleTimeout();
          }
        }, 1000);
      }

      function stopTimer() {
        clearInterval(timerInterval);
      }

      function handleTimeout() {
        const current = state.queue[state.index];
        recordAttempt(current.id, true);
        state.score += 2;
        state.streak = 0;
        saveProgress();

        if (!state.recycled.has(current.id)) {
          state.recycled.add(current.id);
          state.resurfaceIds.add(current.id);
          state.queue.push(current);
        }

        showModal(
          `⏰ Time's up! The word was "${current.word}". Check ${describeLocation(current)} to review it. (+2 for trying!)`,
          "Next Word",
          nextWord,
        );
      }

      //the reusable popup function
      function showModal(message, buttonText, onDismiss) {
        const overlay = document.getElementById("modal-overlay");
        document.getElementById("modal-message").textContent = message;
        const btn = document.getElementById("modal-btn");
        btn.textContent = buttonText;
        overlay.classList.add("active");
        btn.onclick = () => {
          overlay.classList.remove("active");
          if (onDismiss) onDismiss();
        };
      }

      // this is the year generated code for the footer.
      document.getElementById("copyright-year").textContent =
        new Date().getFullYear();

      function tryAutoLogin() {
        const saved = localStorage.getItem("currentChild");
        if (saved && ROSTER.some((r) => r.name === saved)) {
          state.child = saved;
          document.getElementById("stats").style.display = "flex";
          loadProgress();
          if (state.deepLink) {
            startFromDeepLink();
          } else {
            showScreen("menu");
            renderMenu();
          }
        }
      }
      tryAutoLogin();
    </script>
  </body>
</html>
