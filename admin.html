<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <script src="data.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #1e2a3a;
        color: #f4efe6;
        padding: 20px;
      }
      h1 {
        font-size: 1.4rem;
      }

      .card {
        background: #26374a;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .hint {
        color: #b9c3ce;
        font-size: 0.85rem;
      }
      textarea {
        width: 100%;
        background: #31445a;
        color: #f4efe6;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-family: monospace;
      }
      #add-words-btn {
        background: #4ecdc4;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 8px;
        font-weight: bold;
      }
      #add-words-feedback {
        margin-top: 8px;
        color: #4fb286;
        font-size: 0.9rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #31445a;
      }
      .clickable-row {
        cursor: pointer;
      }
      .clickable-row:hover {
        background: #31445a;
      }
      .child-card {
        background: #26374a;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .child-card h3 {
        margin: 0 0 10px;
      }
      .weak-word {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background: #31445a;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 6px;
        font-size: 0.9rem;
      }
      .weak-word .ipa {
        color: #ffc94a;
        margin-left: 6px;
      }
      .weak-word .stats {
        color: #b9c3ce;
        font-size: 0.8rem;
      }
      .weak-word button {
        background: #ff6b5b;
        border: none;
        color: white;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .none {
        color: #b9c3ce;
        font-size: 0.9rem;
      }

      .unlock-row {
        display: flex;
        gap: 16px;
        margin-bottom: 12px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>📊 Admin Dashboard</h1>
    <div class="card">
      <h3>➕ Add Words</h3>
      <p class="hint">
        One word per line: <code>word, ipa, material, page, topic</code> (topic
        only needed for wordbank)
      </p>
      <textarea
        id="bulk-words-input"
        rows="6"
        placeholder="cat, /kæt/, part1, 1
add, /æd/, wordbank, 1, mathematics"
      ></textarea>
      <button id="add-words-btn">Add Words</button>
      <div id="add-words-feedback"></div>
    </div>
    <div class="card">
      <h3>🏆 Children Performance</h3>
      <table id="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Score</th>
            <th>Trouble Words</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
    <div id="child-details"></div>

    <script>
      function getChildProgress(name) {
        const raw = localStorage.getItem(`wordmastery_${name}`);
        return raw ? JSON.parse(raw) : { score: 0, streak: 0, words: {} };
      }

      function getWeakWords(progress) {
        return Object.entries(progress.words || {})
          .map(([id, stats]) => ({
            id: Number(id),
            ...stats,
            trouble: stats.wrongAttempts + stats.skips,
          }))
          .filter((w) => w.trouble > 0)
          .sort((a, b) => b.trouble - a.trouble);
      }

      // function findWord(id) {
      //   return WORDS.find((w) => w.id === id);
      // }
      function findWord(id) {
        return getAllWords().find((w) => w.id === id);
      }
      function flagWord(name, wordId) {
        const key = `flagged_${name}`;
        const flags = JSON.parse(localStorage.getItem(key) || "[]");
        if (!flags.includes(wordId)) flags.push(wordId);
        localStorage.setItem(key, JSON.stringify(flags));
        alert("Flagged for practice.");
      }

      function renderDashboard() {
        const rows = ROSTER.map((child) => {
          const progress = getChildProgress(child.name);
          const weak = getWeakWords(progress);
          return {
            name: child.name,
            score: progress.score,
            weakCount: weak.length,
          };
        }).sort((a, b) => b.score - a.score);

        document.getElementById("leaderboard-body").innerHTML = rows
          .map(
            (r, i) => `
          <tr class="clickable-row" onclick="toggleDetails('${r.name}')">
            <td>${i + 1}</td><td>${r.name}</td><td>${r.score}</td><td>${r.weakCount}</td><td>▾</td>
          </tr>
        `,
          )
          .join("");
      }

      function toggleDetails(name) {
        const container = document.getElementById("child-details");
        if (container.dataset.current === name) {
          container.innerHTML = "";
          container.dataset.current = "";
          return;
        }
        container.dataset.current = name;
        const progress = getChildProgress(name);
        const weak = getWeakWords(progress);
        const weakHtml = weak.length
          ? weak
              .map((w) => {
                const word = findWord(w.id);
                if (!word) return "";
                return `<div class="weak-word">
                        <span>${word.word} <span class="ipa">${word.ipa}</span></span>
                        <span class="stats">${w.wrongAttempts} wrong, ${w.skips} skipped</span>
                        <button onclick="flagWord('${name}', ${w.id})">🚩 Flag</button>
                      </div>`;
              })
              .join("")
          : `<p class="none">No trouble words yet.</p>`;
        const unlocked = getUnlockStatus(name);
        container.innerHTML = `<div class="child-card">
      <h3>${name}'s trouble words</h3>
      <div class="unlock-row">
        <label><input type="checkbox" ${unlocked.part2 ? "checked" : ""} onchange="handleUnlockToggle('${name}','part2',this.checked)"> Part 2 unlocked</label>
        <label><input type="checkbox" ${unlocked.wordbank ? "checked" : ""} onchange="handleUnlockToggle('${name}','wordbank',this.checked)"> Word Bank unlocked</label>
      </div>
      ${weakHtml}
    </div>`;
      }

      function handleBulkAdd() {
        const raw = document.getElementById("bulk-words-input").value.trim();
        if (!raw) return;
        const lines = raw
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean);
        let added = 0;
        lines.forEach((line) => {
          const parts = line.split(",").map((p) => p.trim());
          const [word, ipa, material, page, topic] = parts;
          if (!word || !ipa || !material || !page) return;
          addCustomWord({
            word,
            ipa,
            material,
            page: Number(page),
            topic: topic || undefined,
          });
          added++;
        });
        document.getElementById("add-words-feedback").textContent =
          `Added ${added} word(s).`;
        document.getElementById("bulk-words-input").value = "";
        renderDashboard();
      }
      document.getElementById("add-words-btn").onclick = handleBulkAdd;

      function handleUnlockToggle(name, material, checked) {
        setUnlockStatus(name, material, checked);
      }

      renderDashboard();
    </script>
  </body>
</html>
